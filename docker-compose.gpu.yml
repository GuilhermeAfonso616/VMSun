services:
  analitico:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  analitico-runtime:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  camera-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.gpu
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "${CAMERA_GATEWAY_NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${CAMERA_GATEWAY_NVIDIA_DRIVER_CAPABILITIES:-video,compute,utility}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
