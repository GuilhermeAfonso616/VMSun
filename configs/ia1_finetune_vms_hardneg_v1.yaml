name: ia1_finetune_vms_hardneg_v1
description: Fine-tuning auditavel da IA1 com positivos externos e eventos revisados do VMS.

paths:
  project_root: D:/Analitico
  database: D:/Analitico/analytics.db
  snapshot_roots:
    - D:/Analitico
    - D:/Analitico/data
  external_person_dataset: D:/IA/datasets/mixed_day_night_virat20_yolo_v2
  output_dataset: D:/IA/datasets/ia1_finetune_vms_hardneg_v1
  reports: D:/Analitico/reports/ia1_finetune_vms_hardneg_v1
  ia1_current_model: D:/Analitico/best.pt
  ia1_candidate_model: D:/Analitico/models/ia1_candidate/ia1_candidate_vms_hardneg_v1.pt
  runs: D:/Analitico/runs/detect

classes:
  0: person

review_labels:
  positive:
    - true_positive
    - verdadeiro_positivo
    - person
    - pessoa
  negative:
    - false_positive
    - falso_positivo
    - not_person
    - nao_pessoa
    - não_pessoa
  ignore:
    - inconclusive
    - inconclusivo
    - canceled
    - cancelado
    - uncertain
    - incerto

external_dataset:
  enabled: true
  copy_mode: copy
  max_train_images: 6000
  max_val_images: 1000
  max_test_images: 1000
  seed: 43

reviewed_vms:
  positive_mode: full_image_with_event_bbox
  false_positive_mode: padded_crop_empty_label
  false_positive_padding_ratio: 0.35
  min_bbox_width: 2
  min_bbox_height: 2
  reviewed_exports:
    - D:/IA2/reviewed_events_export_20260504_134833

split:
  train: 0.70
  val: 0.15
  test: 0.15
  policy: stable_hash_by_camera_date_event
  reviewed_force_real_validation: true

training:
  imgsz: 640
  epochs: 80
  patience: 20
  batch: 16
  optimizer: AdamW
  lr0: 0.00005
  lrf: 0.01
  seed: 43
  workers: 2

evaluation:
  conf: 0.25
  iou_match_threshold: 0.50
  candidate_model: auto
