name: ia1_v3_prevalidation
description: Pre-validacao dos datasets reais PC teste 1 e PC teste 2 antes do IA1 candidate V3.

paths:
  project_root: D:/Analitico
  reports: D:/Analitico/reports/ia1_v3_prevalidation
  pc_test_1: D:/IA2/dataset_pc_teste_1
  pc_test_2: D:/IA2/dataset_pc_teste_2
  ia1_current_model: D:/Analitico/best.pt
  ia1_candidate_v2_model: D:/Analitico/models/ia1_candidate/ia1_candidate_vms_hardneg_v2.pt
  ia2_revalidator_model: D:/IA2/revalidator/exports/person_crop_revalidator_yolo11n_v5.pt
  ia3_far_model: D:/IA2/revalidator/exports/person_far_revalidator_yolo11n_v1.pt

triage:
  include_labels:
    - person
    - not_person
    - uncertain
  exclude_uncertain_from_train: true
  review_small_person: true
  small_crop_height: 96
  small_crop_width: 80
  review_low_detector_positive_below: 0.35
  review_high_detector_negative_above: 0.70
  review_problem_cameras:
    - 9
    - 10
    - 14
  contact_sheet:
    enabled: true
    max_images_per_sheet: 100
    thumb_width: 160
    thumb_height: 120

model_consensus:
  enabled: false
  # Ativar depois que o treino V2 terminar, para nao disputar GPU.
  # Regras futuras: operador vs IA1/IA2/IA3 para separar trusted/review_required.
