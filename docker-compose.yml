services:
  postgres:
    image: postgres:16-alpine
    container_name: analitico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-analitico}"
      POSTGRES_USER: "${POSTGRES_USER:-analitico}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-analitico}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-analitico} -d $${POSTGRES_DB:-analitico}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  analitico:
    image: analitico_go_v4-analitico
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server-analiticos
    restart: unless-stopped
    command: ["python3", "main.py"]
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_ROLE: "web"
      RUNTIME_API_BASE_URL: "http://analitico-runtime:8001"
      RUNTIME_API_TIMEOUT_SECONDS: "${RUNTIME_API_TIMEOUT_SECONDS:-3}"
      ONVIF_WSDL_DIR: /app/wsdl
      # Instaladores do Video Helper ficam no volume ./data, nao na imagem:
      # publicar uma versao nova nao deve exigir rebuild do container.
      VIDEO_HELPER_DIST_DIR: /data/downloads/video-helper
      HIK_SDK_ENABLED: "${HIK_SDK_ENABLED:-true}"
      HIK_SDK_LIB_DIR: /opt/hikvision/lib
      HIK_SDK_SESSION_TTL_SECONDS: "${HIK_SDK_SESSION_TTL_SECONDS:-900}"
      DAHUA_SDK_ENABLED: "${DAHUA_SDK_ENABLED:-true}"
      DAHUA_SDK_LIB_DIR: /opt/dahua/lib
      LD_LIBRARY_PATH: /opt/dahua/lib:/opt/hikvision/lib:/opt/hikvision/lib/HCNetSDKCom:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
      MOTION_GATE_ENABLED: "${MOTION_GATE_ENABLED:-true}"
      MOTION_GATE_MIN_INTERVAL_SECONDS: "${MOTION_GATE_MIN_INTERVAL_SECONDS:-2.0}"
      MOTION_GATE_THRESHOLD: "${MOTION_GATE_THRESHOLD:-0.015}"
      VISUAL_RAW_PUBLISH_ENABLED: "${VISUAL_RAW_PUBLISH_ENABLED:-false}"
      VISUAL_PROCESSED_PUBLISH_ENABLED: "${VISUAL_PROCESSED_PUBLISH_ENABLED:-true}"
      VISUAL_RAW_PUBLISH_INTERVAL_SECONDS: "${VISUAL_RAW_PUBLISH_INTERVAL_SECONDS:-0.25}"
      VISUAL_PROCESSED_PUBLISH_INTERVAL_SECONDS: "${VISUAL_PROCESSED_PUBLISH_INTERVAL_SECONDS:-0.50}"
      VISUAL_IA_BOXES_ENABLED: "${VISUAL_IA_BOXES_ENABLED:-true}"
      BOX_LATENCY_DIAGNOSTICS_ENABLED: "${BOX_LATENCY_DIAGNOSTICS_ENABLED:-false}"
      BOX_LATENCY_DIAGNOSTICS_CAMERA_IDS: "${BOX_LATENCY_DIAGNOSTICS_CAMERA_IDS:-}"
      BOX_LATENCY_DIAGNOSTICS_SAMPLE_WINDOW: "${BOX_LATENCY_DIAGNOSTICS_SAMPLE_WINDOW:-300}"
      VISUAL_FAST_PATH_ENABLED: "${VISUAL_FAST_PATH_ENABLED:-false}"
      VISUAL_FAST_PATH_CAMERA_IDS: "${VISUAL_FAST_PATH_CAMERA_IDS:-}"
      VISUAL_TRACK_FRESH_MS: "${VISUAL_TRACK_FRESH_MS:-500}"
      VISUAL_TRACK_RETENTION_MS: "${VISUAL_TRACK_RETENTION_MS:-3000}"
      VISUAL_INFERENCE_MAX_FRAME_AGE_MS: "${VISUAL_INFERENCE_MAX_FRAME_AGE_MS:-0}"
      VISUAL_INFERENCE_MAX_FRAME_AGE_CAMERA_IDS: "${VISUAL_INFERENCE_MAX_FRAME_AGE_CAMERA_IDS:-}"
      WEB_TRACK_TRANSPORT_MODE: "${WEB_TRACK_TRANSPORT_MODE:-polling}"
      WEB_TRACK_SSE_CAMERA_IDS: "${WEB_TRACK_SSE_CAMERA_IDS:-}"
      CAMERA_GATEWAY_ENABLED: "true"
      CAMERA_GATEWAY_BASE_URL: "http://camera-gateway:8090"
      CAMERA_GATEWAY_PUBLIC_BASE_URL: "${CAMERA_GATEWAY_PUBLIC_BASE_URL:-}"
      WEBRTC_GATEWAY_ENABLED: "true"
      WEBRTC_GATEWAY_API_BASE_URL: "http://webrtc-gateway:9997"
      WEBRTC_GATEWAY_PUBLIC_BASE_URL: "${WEBRTC_GATEWAY_PUBLIC_BASE_URL:-}"
      WEBRTC_GATEWAY_RTSP_BASE_URL: "rtsp://webrtc-gateway:8554"
      WEBRTC_GATEWAY_RTSP_PUBLIC_BASE_URL: "${WEBRTC_GATEWAY_RTSP_PUBLIC_BASE_URL:-}"
      WEBRTC_GATEWAY_MONITOR_ENABLED: "${WEBRTC_GATEWAY_MONITOR_ENABLED:-true}"
      CAMERA_GATEWAY_VIA_WEBRTC_RTSP_ENABLED: "${CAMERA_GATEWAY_VIA_WEBRTC_RTSP_ENABLED:-false}"
      CAMERA_GATEWAY_SOURCE_MODE: "${CAMERA_GATEWAY_SOURCE_MODE:-mediamtx_prefer}"
      CAMERA_GATEWAY_MEDIAMTX_CAMERA_IDS: "${CAMERA_GATEWAY_MEDIAMTX_CAMERA_IDS:-}"
      MEDIA_BACKBONE_RECONCILE_ENABLED: "${MEDIA_BACKBONE_RECONCILE_ENABLED:-true}"
      MEDIA_BACKBONE_RECONCILE_INTERVAL_SECONDS: "${MEDIA_BACKBONE_RECONCILE_INTERVAL_SECONDS:-30}"
      MEDIA_BACKBONE_REMOVE_ORPHAN_PATHS: "${MEDIA_BACKBONE_REMOVE_ORPHAN_PATHS:-true}"
      CAMERA_GATEWAY_WORKER_CAPTURE_ENABLED: "true"
      CAMERA_GATEWAY_WORKER_RTSP_FALLBACK_ENABLED: "false"
      CAMERA_GATEWAY_CIRCUIT_PARK_AFTER_SECONDS: "${CAMERA_GATEWAY_CIRCUIT_PARK_AFTER_SECONDS:-120}"
      CAMERA_GATEWAY_FIRST_FRAME_TIMEOUT_SECONDS: "${CAMERA_GATEWAY_FIRST_FRAME_TIMEOUT_SECONDS:-15}"
      CAMERA_GATEWAY_RECOVERY_ENABLED: "${CAMERA_GATEWAY_RECOVERY_ENABLED:-true}"
      CAMERA_GATEWAY_RECOVERY_STABLE_SECONDS: "${CAMERA_GATEWAY_RECOVERY_STABLE_SECONDS:-60}"
      CAMERA_GATEWAY_RECOVERY_PROBE_INTERVAL_SECONDS: "${CAMERA_GATEWAY_RECOVERY_PROBE_INTERVAL_SECONDS:-20}"
      CAMERA_GATEWAY_RECOVERY_PROBE_TIMEOUT_SECONDS: "${CAMERA_GATEWAY_RECOVERY_PROBE_TIMEOUT_SECONDS:-10}"
      CAMERA_GATEWAY_RECOVERY_FRESH_FRAME_MAX_AGE_SECONDS: "${CAMERA_GATEWAY_RECOVERY_FRESH_FRAME_MAX_AGE_SECONDS:-10}"
      VISUAL_MOTION_DEBUG_OVERLAY_ENABLED: "false"
      MONITOR_MOTION_BOXES_ENABLED: "false"
      IA2_V8B_SHADOW_ENABLED: "${IA2_V8B_SHADOW_ENABLED:-true}"
      IA2_V8C_SHADOW_ENABLED: "${IA2_V8C_SHADOW_ENABLED:-true}"
      IA3_V2_PROTECTION_ENABLED: "${IA3_V2_PROTECTION_ENABLED:-true}"
      IA3_V2_PROTECTION_MODE: "${IA3_V2_PROTECTION_MODE:-audit}"
      OPERATIONAL_HISTORY_RETENTION_DAYS: "${OPERATIONAL_HISTORY_RETENTION_DAYS:-365}"
      STRATEGY3_V2_MODE: "${STRATEGY3_V2_MODE:-block}"
      ANTI_FP_POST_FILTER_MODE: "${ANTI_FP_POST_FILTER_MODE:-block}"
      EVENT_RULE_DEBUG_ENABLED: "false"
      EVENT_RULE_DEBUG_CAMERA_IDS: ""
      EVENT_RULE_DEBUG_RATE_LIMIT_SECONDS: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      analitico-runtime:
        condition: service_healthy
      camera-gateway:
        condition: service_healthy
      webrtc-gateway:
        condition: service_started
    volumes:
      - ./data:/data
      - ./datasets:/app/datasets
      - ./models:/models:ro
      - ./wsdl:/app/wsdl:ro
      - ${HIK_SDK_HOST_LIB_DIR:-./vendor-local/hikvision/extracted/EN-HCNetSDKV6.1.9.48_build20230410_linux64/lib}:/opt/hikvision/lib:ro
      - ${DAHUA_SDK_HOST_LIB_DIR:-./vendor-local/dahua/extracted/General_NetSDK_Eng_Linux64_IS_V3.060.0000003.0.R.251127/Bin}:/opt/dahua/lib:ro
      - /var/run/docker.sock:/var/run/docker.sock
    shm_size: "1gb"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=analitico"

  analitico-runtime:
    image: analitico_go_v4-analitico
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server-analiticos-runtime
    restart: unless-stopped
    command: ["python3", "main.py"]
    ports:
      - "127.0.0.1:${RUNTIME_INTERNAL_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/health/ready', timeout=3)\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      APP_ROLE: "runtime"
      FRAME_TRANSPORT_MODE: "${FRAME_TRANSPORT_MODE:-http}"
      FRAME_TRANSPORT_CAMERA_IDS: "${FRAME_TRANSPORT_CAMERA_IDS:-}"
      FRAME_TRANSPORT_PROTOCOL_VERSION: "${FRAME_TRANSPORT_PROTOCOL_VERSION:-1}"
      FRAME_TRANSPORT_ROOT: "/run/sunorus/frames"
      FRAME_TRANSPORT_SLOT_COUNT: "${FRAME_TRANSPORT_SLOT_COUNT:-4}"
      FRAME_TRANSPORT_SLOT_CAPACITY_BYTES: "${FRAME_TRANSPORT_SLOT_CAPACITY_BYTES:-2097152}"
      FRAME_TRANSPORT_POLL_INTERVAL_MS: "${FRAME_TRANSPORT_POLL_INTERVAL_MS:-5}"
      FRAME_TRANSPORT_READ_TIMEOUT_MS: "${FRAME_TRANSPORT_READ_TIMEOUT_MS:-1000}"
      FRAME_TRANSPORT_FALLBACK_ENABLED: "${FRAME_TRANSPORT_FALLBACK_ENABLED:-true}"
      INFERENCE_TRANSPORT_MODE: "${INFERENCE_TRANSPORT_MODE:-http}"
      INFERENCE_TRANSPORT_CAMERA_IDS: "${INFERENCE_TRANSPORT_CAMERA_IDS:-}"
      INFERENCE_TRANSPORT_SOCKET_PATH: "${INFERENCE_TRANSPORT_SOCKET_PATH:-/run/sunorus/inference.sock}"
      INFERENCE_TRANSPORT_TIMEOUT_MS: "${INFERENCE_TRANSPORT_TIMEOUT_MS:-5000}"
      IA2_EXECUTION_MODE: "${IA2_EXECUTION_MODE:-local}"
      IA2_CENTRAL_CAMERA_IDS: "${IA2_CENTRAL_CAMERA_IDS:-}"
      IA2_POOL_ENABLED: "${IA2_POOL_ENABLED:-false}"
      IA2_POOL_WORKER_COUNT: "${IA2_POOL_WORKER_COUNT:-1}"
      IA2_POOL_MAX_QUEUE_SIZE: "${IA2_POOL_MAX_QUEUE_SIZE:-64}"
      IA2_POOL_TIMEOUT_MS: "${IA2_POOL_TIMEOUT_MS:-1500}"
      IA2_POOL_MAX_CONCURRENCY: "${IA2_POOL_MAX_CONCURRENCY:-1}"
      IA2_TRANSPORT_MODE: "${IA2_TRANSPORT_MODE:-http}"
      IA2_TRANSPORT_SOCKET_PATH: "${IA2_TRANSPORT_SOCKET_PATH:-/run/sunorus/ia2.sock}"
      IA2_TRANSPORT_TIMEOUT_MS: "${IA2_TRANSPORT_TIMEOUT_MS:-1500}"
      ONVIF_WSDL_DIR: /app/wsdl
      MOTION_GATE_ENABLED: "${MOTION_GATE_ENABLED:-true}"
      MOTION_GATE_MIN_INTERVAL_SECONDS: "${MOTION_GATE_MIN_INTERVAL_SECONDS:-2.0}"
      MOTION_GATE_THRESHOLD: "${MOTION_GATE_THRESHOLD:-0.015}"
      VISUAL_RAW_PUBLISH_ENABLED: "${VISUAL_RAW_PUBLISH_ENABLED:-false}"
      VISUAL_PROCESSED_PUBLISH_ENABLED: "${VISUAL_PROCESSED_PUBLISH_ENABLED:-true}"
      VISUAL_RAW_PUBLISH_INTERVAL_SECONDS: "${VISUAL_RAW_PUBLISH_INTERVAL_SECONDS:-0.25}"
      VISUAL_PROCESSED_PUBLISH_INTERVAL_SECONDS: "${VISUAL_PROCESSED_PUBLISH_INTERVAL_SECONDS:-0.50}"
      VISUAL_IA_BOXES_ENABLED: "${VISUAL_IA_BOXES_ENABLED:-true}"
      BOX_LATENCY_DIAGNOSTICS_ENABLED: "${BOX_LATENCY_DIAGNOSTICS_ENABLED:-false}"
      BOX_LATENCY_DIAGNOSTICS_CAMERA_IDS: "${BOX_LATENCY_DIAGNOSTICS_CAMERA_IDS:-}"
      BOX_LATENCY_DIAGNOSTICS_SAMPLE_WINDOW: "${BOX_LATENCY_DIAGNOSTICS_SAMPLE_WINDOW:-300}"
      VISUAL_FAST_PATH_ENABLED: "${VISUAL_FAST_PATH_ENABLED:-false}"
      VISUAL_FAST_PATH_CAMERA_IDS: "${VISUAL_FAST_PATH_CAMERA_IDS:-}"
      VISUAL_TRACK_FRESH_MS: "${VISUAL_TRACK_FRESH_MS:-500}"
      VISUAL_TRACK_RETENTION_MS: "${VISUAL_TRACK_RETENTION_MS:-3000}"
      VISUAL_INFERENCE_MAX_FRAME_AGE_MS: "${VISUAL_INFERENCE_MAX_FRAME_AGE_MS:-0}"
      VISUAL_INFERENCE_MAX_FRAME_AGE_CAMERA_IDS: "${VISUAL_INFERENCE_MAX_FRAME_AGE_CAMERA_IDS:-}"
      WEB_TRACK_TRANSPORT_MODE: "${WEB_TRACK_TRANSPORT_MODE:-polling}"
      WEB_TRACK_SSE_CAMERA_IDS: "${WEB_TRACK_SSE_CAMERA_IDS:-}"
      CAMERA_GATEWAY_ENABLED: "true"
      CAMERA_GATEWAY_BASE_URL: "http://camera-gateway:8090"
      CAMERA_GATEWAY_PUBLIC_BASE_URL: "${CAMERA_GATEWAY_PUBLIC_BASE_URL:-}"
      WEBRTC_GATEWAY_ENABLED: "true"
      WEBRTC_GATEWAY_API_BASE_URL: "http://webrtc-gateway:9997"
      WEBRTC_GATEWAY_PUBLIC_BASE_URL: "${WEBRTC_GATEWAY_PUBLIC_BASE_URL:-}"
      WEBRTC_GATEWAY_RTSP_BASE_URL: "rtsp://webrtc-gateway:8554"
      WEBRTC_GATEWAY_RTSP_PUBLIC_BASE_URL: "${WEBRTC_GATEWAY_RTSP_PUBLIC_BASE_URL:-}"
      WEBRTC_GATEWAY_MONITOR_ENABLED: "${WEBRTC_GATEWAY_MONITOR_ENABLED:-true}"
      CAMERA_GATEWAY_VIA_WEBRTC_RTSP_ENABLED: "${CAMERA_GATEWAY_VIA_WEBRTC_RTSP_ENABLED:-false}"
      CAMERA_GATEWAY_SOURCE_MODE: "${CAMERA_GATEWAY_SOURCE_MODE:-mediamtx_prefer}"
      CAMERA_GATEWAY_MEDIAMTX_CAMERA_IDS: "${CAMERA_GATEWAY_MEDIAMTX_CAMERA_IDS:-}"
      MEDIA_BACKBONE_RECONCILE_ENABLED: "${MEDIA_BACKBONE_RECONCILE_ENABLED:-true}"
      MEDIA_BACKBONE_RECONCILE_INTERVAL_SECONDS: "${MEDIA_BACKBONE_RECONCILE_INTERVAL_SECONDS:-30}"
      MEDIA_BACKBONE_REMOVE_ORPHAN_PATHS: "${MEDIA_BACKBONE_REMOVE_ORPHAN_PATHS:-true}"
      CAMERA_GATEWAY_WORKER_CAPTURE_ENABLED: "true"
      CAMERA_GATEWAY_WORKER_RTSP_FALLBACK_ENABLED: "false"
      CAMERA_GATEWAY_CIRCUIT_PARK_AFTER_SECONDS: "${CAMERA_GATEWAY_CIRCUIT_PARK_AFTER_SECONDS:-120}"
      CAMERA_GATEWAY_FIRST_FRAME_TIMEOUT_SECONDS: "${CAMERA_GATEWAY_FIRST_FRAME_TIMEOUT_SECONDS:-15}"
      CAMERA_GATEWAY_RECOVERY_ENABLED: "${CAMERA_GATEWAY_RECOVERY_ENABLED:-true}"
      CAMERA_GATEWAY_RECOVERY_STABLE_SECONDS: "${CAMERA_GATEWAY_RECOVERY_STABLE_SECONDS:-60}"
      CAMERA_GATEWAY_RECOVERY_PROBE_INTERVAL_SECONDS: "${CAMERA_GATEWAY_RECOVERY_PROBE_INTERVAL_SECONDS:-20}"
      CAMERA_GATEWAY_RECOVERY_PROBE_TIMEOUT_SECONDS: "${CAMERA_GATEWAY_RECOVERY_PROBE_TIMEOUT_SECONDS:-10}"
      CAMERA_GATEWAY_RECOVERY_FRESH_FRAME_MAX_AGE_SECONDS: "${CAMERA_GATEWAY_RECOVERY_FRESH_FRAME_MAX_AGE_SECONDS:-10}"
      VISUAL_MOTION_DEBUG_OVERLAY_ENABLED: "false"
      MONITOR_MOTION_BOXES_ENABLED: "false"
      IA2_V8B_SHADOW_ENABLED: "${IA2_V8B_SHADOW_ENABLED:-true}"
      IA2_V8C_SHADOW_ENABLED: "${IA2_V8C_SHADOW_ENABLED:-true}"
      IA3_V2_PROTECTION_ENABLED: "${IA3_V2_PROTECTION_ENABLED:-true}"
      IA3_V2_PROTECTION_MODE: "${IA3_V2_PROTECTION_MODE:-audit}"
      OPERATIONAL_HISTORY_RETENTION_DAYS: "${OPERATIONAL_HISTORY_RETENTION_DAYS:-365}"
      STRATEGY3_V2_MODE: "${STRATEGY3_V2_MODE:-block}"
      ANTI_FP_POST_FILTER_MODE: "${ANTI_FP_POST_FILTER_MODE:-block}"
      EVENT_RULE_DEBUG_ENABLED: "false"
      EVENT_RULE_DEBUG_CAMERA_IDS: ""
      EVENT_RULE_DEBUG_RATE_LIMIT_SECONDS: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      camera-gateway:
        condition: service_healthy
      webrtc-gateway:
        condition: service_started
    volumes:
      - ./data:/data
      - ./datasets:/app/datasets
      - ./models:/models:ro
      - ./wsdl:/app/wsdl:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - frame_data:/run/sunorus/frames:ro
    shm_size: "1gb"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=analitico-runtime"

  camera-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: camera-gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
    entrypoint: ["/bin/sh", "-c", "/app/gateway >> /logs/gateway.log 2>&1"]
    env_file:
      - .env.docker
    environment:
      GATEWAY_ADDR: ":8090"
      GATEWAY_FFMPEG_PATH: "ffmpeg"
      GATEWAY_STREAM_POLL_MS: "200"
      GATEWAY_FRAME_STALE_AFTER_SECONDS: "10"
      GATEWAY_OUTPUT_FPS: "${GATEWAY_OUTPUT_FPS:-2}"
      GATEWAY_JPEG_QUALITY: "${GATEWAY_JPEG_QUALITY:-12}"
      GATEWAY_FFMPEG_LATENCY_PROFILE: "${GATEWAY_FFMPEG_LATENCY_PROFILE:-compatibility}"
      GATEWAY_FFMPEG_BALANCED_CAMERA_IDS: "${GATEWAY_FFMPEG_BALANCED_CAMERA_IDS:-}"
      GATEWAY_FFMPEG_LOW_LATENCY_CAMERA_IDS: "${GATEWAY_FFMPEG_LOW_LATENCY_CAMERA_IDS:-}"
      GATEWAY_FFMPEG_PROFILE_FALLBACK_ENABLED: "${GATEWAY_FFMPEG_PROFILE_FALLBACK_ENABLED:-true}"
      GATEWAY_FFMPEG_PROFILE_STRICT: "${GATEWAY_FFMPEG_PROFILE_STRICT:-false}"
      GATEWAY_MAX_ANALYTIC_FRAME_AGE_MS: "${GATEWAY_MAX_ANALYTIC_FRAME_AGE_MS:-0}"
      GATEWAY_MAX_ANALYTIC_FRAME_AGE_CAMERA_IDS: "${GATEWAY_MAX_ANALYTIC_FRAME_AGE_CAMERA_IDS:-}"
      GATEWAY_FRAME_LAG_WATCHDOG_ENABLED: "${GATEWAY_FRAME_LAG_WATCHDOG_ENABLED:-false}"
      GATEWAY_FRAME_LAG_WATCHDOG_CAMERA_IDS: "${GATEWAY_FRAME_LAG_WATCHDOG_CAMERA_IDS:-}"
      GATEWAY_FRAME_LAG_RESTART_THRESHOLD_MS: "${GATEWAY_FRAME_LAG_RESTART_THRESHOLD_MS:-2000}"
      GATEWAY_FRAME_LAG_RESTART_HOLD_SECONDS: "${GATEWAY_FRAME_LAG_RESTART_HOLD_SECONDS:-5}"
      GATEWAY_FRAME_LAG_RESTART_COOLDOWN_SECONDS: "${GATEWAY_FRAME_LAG_RESTART_COOLDOWN_SECONDS:-30}"
      GATEWAY_FRAME_LAG_RESTART_MAX_PER_HOUR: "${GATEWAY_FRAME_LAG_RESTART_MAX_PER_HOUR:-3}"
      GATEWAY_FFMPEG_HWACCEL_ENABLED: "${GATEWAY_FFMPEG_HWACCEL_ENABLED:-false}"
      GATEWAY_FFMPEG_HWACCEL_FALLBACK_ENABLED: "${GATEWAY_FFMPEG_HWACCEL_FALLBACK_ENABLED:-true}"
      GATEWAY_FFMPEG_HWACCEL: "${GATEWAY_FFMPEG_HWACCEL:-cuda}"
      GATEWAY_FFMPEG_HWACCEL_OUTPUT_FORMAT: "${GATEWAY_FFMPEG_HWACCEL_OUTPUT_FORMAT:-cuda}"
      GATEWAY_FFMPEG_VIDEO_DECODER: "${GATEWAY_FFMPEG_VIDEO_DECODER:-}"
      GATEWAY_FFMPEG_GPU_SCALE_ENABLED: "${GATEWAY_FFMPEG_GPU_SCALE_ENABLED:-true}"
      GATEWAY_FFMPEG_GPU_SCALE_WIDTH: "${GATEWAY_FFMPEG_GPU_SCALE_WIDTH:-960}"
      GATEWAY_FFMPEG_GPU_SCALE_HEIGHT: "${GATEWAY_FFMPEG_GPU_SCALE_HEIGHT:-540}"
      GATEWAY_RTSP_TRANSPORT: "tcp"
      GATEWAY_ENABLE_LOW_LATENCY: "false"
      GATEWAY_RECONNECT_DELAY_SECONDS: "5"
      GATEWAY_RECONNECT_BACKOFF_MAX_SECONDS: "30"
      GATEWAY_BACKBONE_RECONNECT_DELAY_SECONDS: "${GATEWAY_BACKBONE_RECONNECT_DELAY_SECONDS:-1}"
      GATEWAY_BACKBONE_RECONNECT_BACKOFF_MAX_SECONDS: "${GATEWAY_BACKBONE_RECONNECT_BACKOFF_MAX_SECONDS:-5}"
      GATEWAY_FIRST_FRAME_TIMEOUT_SECONDS: "60"
      GATEWAY_FRAME_RING_MAX: "${GATEWAY_FRAME_RING_MAX:-5}"
      GATEWAY_MAX_CONCURRENT_STARTS: "${GATEWAY_MAX_CONCURRENT_STARTS:-2}"
      GATEWAY_MAX_CONCURRENT_RECOVERS: "${GATEWAY_MAX_CONCURRENT_RECOVERS:-2}"
      GATEWAY_START_STAGGER_MS: "${GATEWAY_START_STAGGER_MS:-1500}"
      GATEWAY_QUEUE_AGING_SECONDS: "10"
      GATEWAY_FLAP_WINDOW_SECONDS: "120"
      GATEWAY_FLAP_THRESHOLD: "4"
      GATEWAY_CIRCUIT_BREAKER_SECONDS: "60"
      GATEWAY_NODE_MAX_ACTIVE_CAMERAS: "${GATEWAY_NODE_MAX_ACTIVE_CAMERAS:-16}"
      GATEWAY_HEALTH_CHECK_INTERVAL_SECONDS: "2"
      GATEWAY_ENABLE_FALLBACK_RTSP: "false"
      GATEWAY_SOURCE_POLICY: "${GATEWAY_SOURCE_POLICY:-any}"
      GATEWAY_ALLOWED_RTSP_HOSTS: "${GATEWAY_ALLOWED_RTSP_HOSTS:-webrtc-gateway}"
      GATEWAY_DEFAULT_CAMERA_PRIORITY: "5"
      GATEWAY_MAX_RETRY_BEFORE_FALLBACK: "5"
      FRAME_TRANSPORT_MODE: "${FRAME_TRANSPORT_MODE:-http}"
      FRAME_TRANSPORT_CAMERA_IDS: "${FRAME_TRANSPORT_CAMERA_IDS:-}"
      FRAME_TRANSPORT_PROTOCOL_VERSION: "${FRAME_TRANSPORT_PROTOCOL_VERSION:-1}"
      FRAME_TRANSPORT_ROOT: "/run/sunorus/frames"
      FRAME_TRANSPORT_SLOT_COUNT: "${FRAME_TRANSPORT_SLOT_COUNT:-4}"
      FRAME_TRANSPORT_SLOT_CAPACITY_BYTES: "${FRAME_TRANSPORT_SLOT_CAPACITY_BYTES:-2097152}"
      FRAME_TRANSPORT_REMOVE_ON_STOP: "${FRAME_TRANSPORT_REMOVE_ON_STOP:-false}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - ./data/logs:/logs
      - frame_data:/run/sunorus/frames
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=camera-gateway"

  webrtc-gateway:
    image: bluenviron/mediamtx:1
    container_name: webrtc-gateway
    restart: unless-stopped
    command: ["/mediamtx.yml"]
    env_file:
      - .env.docker
    ports:
      - "${WEBRTC_GATEWAY_RTSP_BIND_ADDRESS:-0.0.0.0}:8554:8554/tcp"
      - "${WEBRTC_GATEWAY_BIND_ADDRESS:-0.0.0.0}:8889:8889"
      - "${WEBRTC_GATEWAY_BIND_ADDRESS:-0.0.0.0}:8189:8189/udp"
      - "${WEBRTC_GATEWAY_BIND_ADDRESS:-0.0.0.0}:8189:8189/tcp"
    volumes:
      - ./webrtc-gateway/mediamtx.yml:/mediamtx.yml:ro
      - ./data/logs:/logs
    environment:
      MTX_CONF: /mediamtx.yml
      # Preenchido automaticamente pelos inicializadores do host. Como o
      # MediaMTX roda em container, ele nao enxerga o IPv4 LAN do Windows.
      MTX_WEBRTCADDITIONALHOSTS: "${MTX_WEBRTCADDITIONALHOSTS:-}"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=webrtc-gateway"

volumes:
  postgres_data:
  frame_data:
