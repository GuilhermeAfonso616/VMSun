services:
  vmsun-postgres:
    image: postgres:16-alpine
    container_name: vmsun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-vmsun}"
      POSTGRES_USER: "${POSTGRES_USER:-vmsun}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-vmsun}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vmsun} -d $${POSTGRES_DB:-vmsun}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - vmsun_postgres_data:/var/lib/postgresql/data

  vmsun-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmsun-web
    restart: unless-stopped
    command: ["python3", "main.py"]
    ports:
      - "${APP_PORT:-8100}:8000"
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_ROLE: "web"
      PRODUCT_MODE: "vms"
      ONVIF_WSDL_DIR: /app/wsdl
      HIK_SDK_ENABLED: "${HIK_SDK_ENABLED:-true}"
      HIK_SDK_LIB_DIR: /opt/hikvision/lib
      DAHUA_SDK_ENABLED: "${DAHUA_SDK_ENABLED:-true}"
      DAHUA_SDK_LIB_DIR: /opt/dahua/lib
      CAMERA_GATEWAY_ENABLED: "true"
      CAMERA_GATEWAY_BASE_URL: "http://vmsun-camera-gateway:8090"
      WEBRTC_GATEWAY_ENABLED: "true"
      WEBRTC_GATEWAY_API_BASE_URL: "http://vmsun-mediamtx:9997"
      WEBRTC_GATEWAY_RTSP_BASE_URL: "rtsp://vmsun-mediamtx:8554"
      MEDIA_BACKBONE_RECONCILE_ENABLED: "true"
    depends_on:
      vmsun-postgres:
        condition: service_healthy
      vmsun-control:
        condition: service_healthy
      vmsun-camera-gateway:
        condition: service_healthy
      vmsun-mediamtx:
        condition: service_started
    volumes:
      - ./data:/data
      - ./wsdl:/app/wsdl:ro
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=vmsun-web"

  vmsun-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmsun-control
    restart: unless-stopped
    command: ["python3", "main.py"]
    ports:
      - "127.0.0.1:${RUNTIME_INTERNAL_PORT:-8101}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/health/ready', timeout=3)\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      APP_ROLE: "control"
      PRODUCT_MODE: "vms"
      ONVIF_WSDL_DIR: /app/wsdl
      CAMERA_GATEWAY_ENABLED: "true"
      CAMERA_GATEWAY_BASE_URL: "http://vmsun-camera-gateway:8090"
      WEBRTC_GATEWAY_ENABLED: "true"
      WEBRTC_GATEWAY_API_BASE_URL: "http://vmsun-mediamtx:9997"
      WEBRTC_GATEWAY_RTSP_BASE_URL: "rtsp://vmsun-mediamtx:8554"
      MEDIA_BACKBONE_RECONCILE_ENABLED: "true"
    depends_on:
      vmsun-postgres:
        condition: service_healthy
      vmsun-camera-gateway:
        condition: service_healthy
      vmsun-mediamtx:
        condition: service_started
    volumes:
      - ./data:/data
      - ./wsdl:/app/wsdl:ro
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=vmsun-control"

  vmsun-camera-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: vmsun-camera-gateway
    restart: unless-stopped
    ports:
      - "${CAMERA_GATEWAY_PORT:-8190}:8090"
    entrypoint: ["/bin/sh", "-c", "/app/gateway >> /logs/gateway.log 2>&1"]
    env_file:
      - .env.docker
    environment:
      GATEWAY_ADDR: ":8090"
      GATEWAY_FFMPEG_PATH: "ffmpeg"
      GATEWAY_STREAM_POLL_MS: "200"
      GATEWAY_FRAME_STALE_AFTER_SECONDS: "10"
      GATEWAY_OUTPUT_FPS: "2"
      GATEWAY_JPEG_QUALITY: "12"
      GATEWAY_RTSP_TRANSPORT: "tcp"
      GATEWAY_RECONNECT_DELAY_SECONDS: "5"
      GATEWAY_HEALTH_CHECK_INTERVAL_SECONDS: "2"
      GATEWAY_NODE_MAX_ACTIVE_CAMERAS: "16"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - ./data/logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=vmsun-camera-gateway"

  vmsun-mediamtx:
    image: bluenviron/mediamtx:1
    container_name: vmsun-mediamtx
    restart: unless-stopped
    command: ["/mediamtx.yml"]
    env_file:
      - .env.docker
    ports:
      - "${WEBRTC_GATEWAY_RTSP_BIND_ADDRESS:-0.0.0.0}:8654:8554/tcp"
      - "${WEBRTC_GATEWAY_BIND_ADDRESS:-0.0.0.0}:8989:8889"
      - "${WEBRTC_GATEWAY_BIND_ADDRESS:-0.0.0.0}:8289:8189/udp"
      - "${WEBRTC_GATEWAY_BIND_ADDRESS:-0.0.0.0}:8289:8189/tcp"
    volumes:
      - ./webrtc-gateway/mediamtx.yml:/mediamtx.yml:ro
      - ./data/logs:/logs
    environment:
      MTX_CONF: /mediamtx.yml
      MTX_WEBRTCADDITIONALHOSTS: "${MTX_WEBRTCADDITIONALHOSTS:-}"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=vmsun-mediamtx"

volumes:
  vmsun_postgres_data:
